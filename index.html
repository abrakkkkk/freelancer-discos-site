<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Discos — Em Breve</title>
  <meta name="description" content="Freelancer Discos. Loja online em breve. Atendimento via WhatsApp e Instagram.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      max-width: 420px;
      width: 100%;
      padding: 36px 24px 28px;
      text-align: center;
    }
    .logo {
      max-width: 130px;
      height: auto;
      margin-bottom: 24px;
      border-radius: 4px;
    }
    h1 {
      font-size: 22px;
      color: #ffffff;
      margin-bottom: 24px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-whatsapp {
      background-color: #25d366;
      color: #000000;
    }
    .btn-instagram {
      background-color: #262626;
      color: #ffffff;
      border: 1px solid #383838;
    }
    .footer {
      border-top: 1px solid #292929;
      padding-top: 18px;
      font-size: 13px;
      color: #888888;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="Freelancer Discos" class="logo">
    <h1>Loja online em breve</h1>
    
    <div class="actions">
      <a href="https://wa.me/5585987879214" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
        Atendimento no WhatsApp
      </a>
      <a href="https://www.instagram.com/freelancer_discosalex/" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
        Instagram @freelancer_discosalex
      </a>
    </div>

    <footer class="footer">
      Rua Dr. João Moreira, 485 — Centro, Fortaleza - CE<br>
      Envios para todo o Brasil
    </footer>
  </main>
</body>
</html>
