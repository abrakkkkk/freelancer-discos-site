<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Discos — Em Breve</title>
  <meta name="description" content="A nova loja online da Freelancer Discos está chegando. Faça seu pedido de discos de vinil pelo WhatsApp ou acompanhe no Instagram.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }
    .card {
      background-color: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      max-width: 440px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      max-width: 130px;
      height: auto;
      margin-bottom: 20px;
      border-radius: 4px;
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
      color: #f59e0b;
      background: #272010;
      border: 1px solid #4a3810;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 24px;
      color: #ffffff;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      font-size: 15px;
      color: #a0a0a0;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-whatsapp {
      background-color: #25d366;
      color: #000000;
    }
    .btn-instagram {
      background-color: #262626;
      color: #ffffff;
      border: 1px solid #383838;
    }
    .footer {
      border-top: 1px solid #292929;
      padding-top: 18px;
      font-size: 13px;
      color: #777777;
    }
    .footer strong {
      color: #999999;
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="Freelancer Discos" class="logo">
    <br>
    <span class="tag">Em Construção</span>
    <h1>Nova Loja Online</h1>
    <p>Estamos preparando o acervo completo para compras e reservas de discos de vinil pela internet.</p>
    
    <div class="actions">
      <a href="https://wa.me/5585999999999" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">
        Atendimento no WhatsApp
      </a>
      <a href="https://instagram.com/freelancerdiscos" target="_blank" rel="noopener noreferrer" class="btn btn-instagram">
        Siga no Instagram (@freelancerdiscos)
      </a>
    </div>

    <footer class="footer">
      <p style="margin-bottom: 4px;"><strong>Freelancer Discos</strong></p>
      <p style="margin-bottom: 0;">Rua Dr. João Moreira, 485 — Centro, Fortaleza - CE<br>Envios para todo o Brasil</p>
    </footer>
  </main>
</body>
</html>
